<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClipForge Legal</title>
<style>
  :root {
    --bg: #faf9fc;
    --surface: #ffffff;
    --border: #e7e3ef;
    --ink: #18161f;
    --ink-muted: #6b6675;
    --ink-faint: #9691a0;
    --accent: #7c4fe0;
    --accent-2: #d6357d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0a0e;
      --surface: #131318;
      --border: #26262f;
      --ink: #eceef1;
      --ink-muted: #9491a0;
      --ink-faint: #6d6a78;
      --accent: #8b5cf6;
      --accent-2: #ec4899;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a0a0e;
    --surface: #131318;
    --border: #26262f;
    --ink: #eceef1;
    --ink-muted: #9491a0;
    --ink-faint: #6d6a78;
    --accent: #8b5cf6;
    --accent-2: #ec4899;
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 420px;
    margin: 24px;
    padding: 36px 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    color: var(--ink-muted);
    margin-bottom: 22px;
  }
  .brand .mark {
    width: 20px; height: 20px;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    flex-shrink: 0;
  }

  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-size: 26px;
    font-weight: 600;
    line-height: 1.2;
    margin: 0 0 10px;
    text-wrap: balance;
  }

  p {
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--ink-muted);
    margin: 0 0 26px;
  }

  .links { display: flex; flex-direction: column; gap: 10px; }
  .links a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--ink);
    text-decoration: none;
    font-size: 14.5px;
    font-weight: 600;
    transition: border-color 0.15s ease;
  }
  .links a:hover { border-color: var(--accent); }
  .links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .links a .arrow { color: var(--accent); font-family: "IBM Plex Mono", monospace; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
</head>
<body>
<div class="card">
  <div class="brand"><span class="mark"></span> ClipForge</div>
  <h1>Legal documents</h1>
  <p>ClipForge is a personal, self-hosted video-clipping tool. These are its required-reading pages for the platform integrations it connects to.</p>
  <div class="links">
    <a href="./privacy-policy.html">Privacy Policy <span class="arrow">&rarr;</span></a>
    <a href="./terms-of-service.html">Terms of Service <span class="arrow">&rarr;</span></a>
  </div>
</div>
</body>
</html>
